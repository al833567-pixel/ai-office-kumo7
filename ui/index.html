<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 辦公室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
html,body{margin:0}

/* Layout: 像素辦公室（即時）→ 狀態圖例 → 左：目標與任務看板／右：群組聊天與私訊（權限批准按鈕）；點角色開右側面板。刻意只做一種暖色淺色外觀 */
:root{
  --bg:#F2E7D5; --panel:#FFF8EC; --panel-2:#F7ECDA; --ink:#4E3829; --muted:#94785F; --edge:#8B6A4E; --soft:#E3D2B8;
  --honey:#E9A65A; --honey-ink:#3F2810; --rose:#E8A3A0; --sage:#8FB49A;
  --st-idle:#A79C93; --st-working:#5DB585; --st-queued:#6FA3D8; --st-stalled:#E0A43A; --st-error:#E0675A; --st-offline:#8E8597; --st-done:#E8B830; --st-review:#AE8FD6;
  --f-round:"Zen Maru Gothic","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{max-width:1320px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--honey);outline-offset:2px}
.card-px{background:var(--panel);border:2px solid var(--edge);border-radius:10px;box-shadow:0 3px 0 var(--soft)}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-round);font-weight:900;font-size:28px;margin:0;letter-spacing:.04em;color:var(--ink)}
.brand h1 span{color:var(--honey)}
.tagline{font-size:12px;color:var(--muted)}
.chips-top{display:flex;gap:8px;flex-wrap:wrap}
.mchip{font-family:var(--f-round);font-weight:700;font-size:12px;padding:3px 12px;display:inline-flex;gap:6px;align-items:center;border-radius:999px}
.mchip i{width:8px;height:8px;border-radius:50%;background:var(--st-working)}

.goal{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:8px}
.goal input{min-width:0;background:var(--panel-2);border:2px solid var(--soft);border-radius:8px;padding:9px 12px;font-size:15px}
.goal input:focus{outline:none;border-color:var(--honey)}
.lead{display:flex;align-items:center;gap:6px;font-family:var(--f-round);font-weight:700;font-size:13px;color:var(--muted);background:var(--panel-2);border:2px solid var(--soft);border-radius:8px;padding:0 6px 0 10px}
.lead select{background:transparent;border:0;color:var(--ink);font-family:var(--f-round);font-weight:900;font-size:15px;padding:8px 2px;cursor:pointer}
.btn{font-family:var(--f-round);font-weight:900;font-size:15px;border:2px solid var(--edge);border-radius:8px;background:var(--honey);color:var(--honey-ink);padding:6px 18px;cursor:pointer;box-shadow:0 3px 0 #B97A35}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #B97A35}
.btn.sm{font-size:13px;padding:2px 10px;box-shadow:0 2px 0 #B97A35}
.btn.ghost{background:var(--panel);box-shadow:0 2px 0 var(--soft)}
.hint{font-size:12px;color:var(--muted);margin:0}
@media (max-width:640px){.goal{grid-template-columns:1fr 1fr}.goal input{grid-column:1/-1}}

.stage{padding:10px;background:#5A4434;border:2px solid #3E2E23;border-radius:14px;box-shadow:0 4px 0 #C8B496}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:6px}
#game{display:block;width:100%;min-width:900px;height:auto;image-rendering:pixelated;cursor:default}
.stage-bar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 4px 0;font-family:var(--f-round);font-weight:700;font-size:12px;color:#EAD9C0}
.swipe{display:none}
@media (max-width:940px){.swipe{display:inline}}

.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px}
.lg{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:13px;background:var(--panel);border:2px solid var(--soft);border-radius:8px}
.lg i{width:10px;height:10px;border-radius:3px;flex:none}
.lg b{font-family:var(--f-round);font-weight:900;white-space:nowrap}
.lg span{color:var(--muted)}

.board-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px}
.board-h h2{font-family:var(--f-round);font-weight:900;font-size:20px;margin:0}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:980px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:540px){.board{grid-template-columns:1fr}}
.col{padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--panel-2);border:2px solid var(--soft);border-radius:10px}
.col h3{margin:0 2px;font-family:var(--f-round);font-weight:900;font-size:15px;display:flex;justify-content:space-between}
.col h3 span{color:var(--muted)}
.card{background:var(--panel);border:2px solid var(--soft);border-left:6px solid var(--c,var(--soft));border-radius:8px;padding:8px 9px;display:flex;flex-direction:column;gap:5px;min-width:0}
.card[draggable=true]{cursor:grab}
.card .title{font-size:13px;line-height:1.45}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.id{font-family:var(--f-mono)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:0 7px;background:var(--panel-2);border:1px solid var(--soft);border-radius:999px;color:var(--ink);font-size:11px}
.tag.goal{background:var(--honey);color:var(--honey-ink);border-color:transparent;font-family:var(--f-round);font-weight:900}
.tag.warn{border-color:var(--st-stalled);color:#9A6A12}
.av{width:9px;height:9px;border-radius:50%;display:inline-block}
.av.claude{background:#E9967A}.av.hermes{background:#7CC4B8}.av.codex{background:#5E6678}.av.gemini{background:#9D8BD6}.av.antigravity{background:#7FA6E0}.av.other{background:#E8C26A}
.mono{font-family:var(--f-mono)}
.err{font-family:var(--f-mono);font-size:11px;color:#B8473B;background:#FBE3DE;border-radius:6px;padding:4px 6px;overflow-wrap:anywhere}
.actions{display:flex;gap:6px;flex-wrap:wrap}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);z-index:20;display:flex;flex-direction:column;background:var(--panel);border-left:2px solid var(--edge);box-shadow:-8px 0 30px rgb(80 50 30 / .2);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
@media (max-width:640px){.drawer{top:auto;height:80%;width:100%;border-left:0;border-top:2px solid var(--edge);border-radius:16px 16px 0 0;padding-left:env(safe-area-inset-left,0px)}}
.dh{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:2px solid var(--soft)}
.dh canvas{width:56px;height:70px;image-rendering:pixelated;background:var(--panel-2);border:2px solid var(--soft);border-radius:10px;flex:none}
.dh h3{margin:0;font-family:var(--f-round);font-weight:900;font-size:20px}
.dmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-round);font-weight:700;font-size:12px;padding:0 8px;border-radius:999px;background:var(--panel-2);border:1px solid var(--st);color:var(--ink)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--st)}
.role{font-family:var(--f-round);font-weight:900;font-size:12px;padding:0 8px;border-radius:999px;background:var(--honey);color:var(--honey-ink)}
.role.rev{background:var(--st-review);color:#2C1748}
.x{margin-left:auto;width:34px;height:34px;font-size:18px;background:var(--panel-2);border:2px solid var(--soft);border-radius:8px;cursor:pointer}
.db{overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:14px}
.sec h4{margin:0 0 6px;font-family:var(--f-round);font-weight:900;font-size:13px;color:var(--muted)}
.now{background:var(--panel-2);border:2px solid var(--soft);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:3px;font-size:13px}
.where{font-family:var(--f-round);font-weight:900;color:#B5722C}
.stream{background:#2E2620;color:#EADBC6;font-family:var(--f-mono);font-size:11.5px;line-height:1.55;border-radius:8px;padding:8px 10px;height:200px;overflow:auto}
.stream div{white-space:pre-wrap;overflow-wrap:anywhere}
.stream .k{color:#9CC6F0}.stream .ok{color:#9FD8B4}.stream .dim{color:#9C8B7A}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:12px}
.hist li{display:flex;gap:8px}
.hist .mono{color:var(--muted);font-size:11px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-round);font-weight:700;font-size:13px;background:var(--panel-2);border:2px solid var(--soft);border-radius:999px;padding:1px 10px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--honey);border-color:var(--edge);color:var(--honey-ink)}

.toasts{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:30;width:min(460px,calc(100% - 32px))}
.toast{font-family:var(--f-round);font-weight:700;font-size:14px;padding:9px 14px;display:flex;gap:10px;align-items:center;animation:tin .25s ease-out}
.toast i{width:10px;height:10px;border-radius:50%;flex:none}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}


.conn{font-family:var(--f-round);font-weight:700;font-size:12px;padding:3px 12px;border-radius:999px;border:2px solid var(--soft);background:var(--panel)}
.conn.on{color:#2F7A52;border-color:#A9D8BC}.conn.off{color:#B8473B;border-color:#F0B8AF}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn.tiny{font-size:12px;padding:2px 10px;box-shadow:0 2px 0 var(--soft);background:var(--panel)}
.goals{display:flex;gap:6px;flex-wrap:wrap}
.goalchip{font-size:12px;background:var(--panel);border:2px solid var(--soft);border-radius:999px;padding:2px 10px}
.goalchip i{font-style:normal;color:var(--muted)}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:1100px){.split{grid-template-columns:1fr}}
.board{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1400px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:540px){.board{grid-template-columns:1fr}}
.res{font-size:11px;color:var(--muted);background:var(--panel-2);border-radius:6px;padding:4px 6px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:90px;overflow:auto}
.err{white-space:pre-wrap;max-height:90px;overflow:auto}
.tag.st-doing{border-color:#A9D8BC}.tag.st-failed{border-color:#F0B8AF}.tag.st-done{border-color:#F2D98A}
select.reassign{font-size:11px;border:1px solid var(--soft);border-radius:6px;background:var(--panel);padding:1px 4px}
a.tag{text-decoration:none}
.chatbox{display:flex;flex-direction:column;gap:8px;padding:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--f-round);font-weight:700;font-size:13px}
.tabs label{display:inline-flex;gap:4px;align-items:center;padding:2px 10px;border:2px solid var(--soft);border-radius:999px;cursor:pointer;background:var(--panel-2)}
.tabs input{accent-color:var(--honey)}
#chat{height:420px;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:4px}
.msg{background:var(--panel-2);border:1px solid var(--soft);border-radius:10px;padding:6px 9px;max-width:92%;font-size:13px}
.msg.bot{background:#F4F7EE}.msg.mine{align-self:flex-end;background:#FFF1D9;border-color:#F2D3A4}
.msg.answered .btns{opacity:.4;pointer-events:none}
.mh{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.mh b{color:var(--ink);font-size:12px}
.mt{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chatform{display:grid;grid-template-columns:auto 1fr auto;gap:6px}
.chatform select,.chatform input{min-width:0;background:var(--panel-2);border:2px solid var(--soft);border-radius:8px;padding:6px 8px;font-size:13px}
@media (max-width:640px){.chatform{grid-template-columns:1fr auto}.chatform select{grid-column:1/-1}}
.login{position:fixed;inset:0;z-index:40;background:rgb(242 231 213 / .92);display:grid;place-items:center;padding:16px}
.login form{max-width:420px;width:100%;padding:20px;display:flex;flex-direction:column;gap:10px}
.login input{background:var(--panel-2);border:2px solid var(--soft);border-radius:8px;padding:9px 12px;font-family:var(--f-mono);font-size:13px}
.login h2{margin:0;font-family:var(--f-round);font-weight:900}
.loginErr{color:#B8473B;font-size:13px;min-height:1em;margin:0}
.login .lf{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:13px}
.login .lf input{font-family:var(--f-round);font-size:15px}
.linkbtn{background:none;border:0;color:var(--ink-2,#7A6455);font-size:12px;text-decoration:underline;cursor:pointer;align-self:center}
.joins{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.join{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 14px;border-color:#E9A65A;background:#FFF6E6}
.join .who{display:flex;align-items:center;gap:6px;font-weight:900}
.join .who img{width:20px;height:20px}
.join .meta{font-size:12px;color:#7A6455}
.join .code{font-family:var(--f-mono);font-weight:900;font-size:18px;letter-spacing:2px;background:#fff;border:2px dashed #E9A65A;border-radius:6px;padding:0 8px}
.join input{background:var(--panel-2);border:2px solid var(--soft);border-radius:6px;padding:4px 8px;font-size:13px;width:130px}
.join .acts{margin-left:auto;display:flex;gap:6px}
.modal{position:fixed;inset:0;z-index:35;background:rgb(60 40 25 / .35);display:grid;place-items:center;padding:16px}
.modal .panel{width:min(980px,100%);max-height:88vh;overflow:auto;padding:16px 18px}
.modal .mh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.modal h2{margin:0;font-family:var(--f-round);font-weight:900}
.modal h3{margin:14px 0 6px;font-size:14px;color:#7A6455}
.modal .hint{font-size:12px;color:#7A6455;margin:6px 0 4px}
.mrow{display:grid;grid-template-columns:28px minmax(120px,1.4fr) minmax(90px,1fr) 70px 120px minmax(110px,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed var(--soft)}
.mrow img{width:22px;height:22px}
.mrow input,.mrow select{width:100%;min-width:0;background:var(--panel-2);border:2px solid var(--soft);border-radius:6px;padding:4px 7px;font-size:13px}
.mrow .u{font-family:var(--f-mono);font-size:12px;color:#7A6455;overflow:hidden;text-overflow:ellipsis}
.mrow .st{font-size:12px}
.mrow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.mrow.off{opacity:.65}
.btn.danger{background:#F3C4BC;box-shadow:0 2px 0 #C9867B}
@media (max-width:760px){.mrow{grid-template-columns:28px 1fr 1fr;}.mrow .u,.mrow .st{grid-column:2/4}.mrow .acts{grid-column:1/4}}
.dtasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:12px}
.dtasks li{display:flex;gap:8px}
.stream .state{color:#F4C77A}
.ico{width:14px;height:14px;image-rendering:pixelated;vertical-align:-2px;flex:none}
.tag .ico{width:12px;height:12px}
.dh h3 .ico{width:18px;height:18px;vertical-align:-3px}
.rename{display:flex;gap:6px}
.rename input{flex:1;min-width:0;background:var(--panel-2);border:2px solid var(--soft);border-radius:8px;padding:5px 9px;font-size:14px}
.rename input:focus{outline:none;border-color:var(--honey)}
.fsbtn{font-family:var(--f-round);font-weight:700;font-size:12px;color:#3E2E23;background:#EAD9C0;border:2px solid #3E2E23;border-radius:8px;padding:2px 10px;cursor:pointer}
.fsbtn:hover{background:#F6E7CE}
.stage:fullscreen{border:0;border-radius:0;box-shadow:none;background:#3A2C22;width:100vw;height:100vh;box-sizing:border-box;padding:10px max(10px,env(safe-area-inset-right,0px)) 10px max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.stage:fullscreen .scroller{overflow:hidden;width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.stage:fullscreen #game{min-width:0;width:min(100%,calc((100vh - 64px) * 1.6));height:auto}
.stage:fullscreen .stage-bar{width:100%}
.stage:fullscreen .swipe{display:none}
.trace{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);background:var(--panel-2);border-radius:6px;padding:4px 6px}
.trace span{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.trace code{font-family:var(--f-mono);color:var(--ink);overflow-wrap:anywhere}
.trace .copy{font-size:11px;border:1px solid var(--soft);border-radius:6px;background:var(--panel);padding:0 6px;cursor:pointer}

</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>AI <span>辦公室</span></h1><span class="tagline" id="me">連線中…</span></div>
    <div class="toolbar"><span class="conn off" id="conn">未連線</span><button class="btn tiny" type="button" id="notifyBtn">🔕 通知關</button><button class="btn tiny" type="button" id="membersBtn">成員</button><button class="btn tiny" type="button" id="pwBtn">改密碼</button><button class="btn tiny" type="button" id="logout">登出</button></div>
  </header>

  <form class="goal card-px" id="goalForm" autocomplete="off">
    <input id="goalInput" placeholder="丟一個目標給團隊，例如：把 B 機的 nginx log 每天壓縮備份，並寫一個查詢 404 的小工具" aria-label="目標">
    <label class="lead" for="leadSelect">主管
      <select id="leadSelect"><option value="auto">自動</option></select>
    </label>
    <button class="btn" type="submit">送出</button>
  </form>

  <section class="joins" id="joins" aria-live="polite" hidden></section>

  <section class="stage" aria-label="辦公室畫面">
    <div class="scroller"><canvas id="game" aria-label="像素辦公室，點角色可看詳情"></canvas></div>
    <div class="stage-bar"><span>點角色看動態與任務 · 角色會依狀態走到不同房間 · 小黑是辦公室的狗</span><span class="swipe">← 左右滑動 →</span><button class="fsbtn" type="button" id="fsBtn" title="全螢幕（F）">⛶ 全螢幕</button></div>
  </section>

  <div class="legend" id="legend"></div>

  <div class="split">
    <section>
      <div class="board-h"><h2>目標與任務</h2><div class="goals" id="goals"></div></div>
      <section class="board" id="board" style="margin-top:10px"></section>
    </section>
    <section class="card-px chatbox" aria-label="聊天">
      <div class="board-h"><h2 style="font-size:18px">聊天</h2>
        <div class="tabs"><label><input type="radio" name="chatTab" value="office" checked>office 群組</label><label><input type="radio" name="chatTab" value="dm">私訊 / 批准<span id="dmBadge"></span></label></div></div>
      <div id="chat" aria-live="polite"></div>
      <form class="chatform" id="chatForm" autocomplete="off">
        <select id="chatThread" aria-label="發到哪個目標的討論串"><option value="">群組（不指定目標）</option></select>
        <input id="chatInput" placeholder="在群組說話，@claude_a 或 @hermes_b 會叫到人" aria-label="訊息">

<script>

/* ================= helpers ================= */
const T=16,W=48,H=30,SC=3,FONT='"Zen Maru Gothic","Noto Sans TC",sans-serif',OL="#5E4332";

let C=ctx; // current drawing context
function R(x,y,w,h,c){C.fillStyle=c;C.fillRect(Math.round(x),Math.round(y),w,h)}
function hex2rgb(h){const n=parseInt(h.slice(1),16);return[n>>16,(n>>8)&255,n&255]}
function shade(h,f){const [r,g,b]=hex2rgb(h),t=f>0?255:0,k=Math.abs(f);return`rgb(${Math.round(r+(t-r)*k)},${Math.round(g+(t-g)*k)},${Math.round(b+(t-b)*k)})`}
function box(x,y,w,h,base,ol=OL){R(x,y,w,h,ol);R(x+1,y+1,w-2,h-2,base);R(x+1,y+1,w-2,1,shade(base,.3));R(x+1,y+h-2,w-2,1,shade(base,-.15))}

const hash=(x,y)=>{let h=x*374761393+y*668265263;h=(h^(h>>13))*1274126177;return((h^(h>>16))>>>0)/4294967295};

/* ================= map ================= */
const tile=[...Array(H)].map(()=>Array(W).fill("cap"));

fill(39,6,46,10,"water");for(const [x,y] of [[39,6],[39,10],[46,10],[46,6],[40,10]])tile[y][x]="grass";
fill(41,5,42,8,"dock");
for(const [x,y] of [[25,7],[25,8],[36,7],[36,8],[25,23],[25,24],[36,23],[36,24],[11,17],[12,17],[13,17],[11,18],[12,18],[13,18],[30,12],[31,12],[30,13],[31,13],[41,12],[42,12],[41,13],[42,13]])tile[y][x]="door";
tile[29][4]="exit";tile[29][5]="exit";
const WALK=new Set(["wood","cream","sage","grass","mint","lav","door","exit","dock"]);
const walk=tile.map(r=>r.map(t=>WALK.has(t)));
const isFacade=t=>t&&t.startsWith("f-");

const WALLPAPER={"f-work":["#F4E4C4","#EFDAB3"],"f-lounge":["#E7EED3","#DDE7C6"],"f-meet":["#DDE7EE","#D2DEE8"],"f-pantry":["#FBEBD0","#F4DEBA"],"f-game":["#EBDDF0","#E1D1EA"]};
function drawTile(x,y,t){
  const X=x*T,Y=y*T;
  if(t==="f-garden"){const top=y===1;R(X,Y,16,16,top?"#CFE8F1":"#DDF0F4");if(top&&hash(x,1)>.6){R(X+3,Y+6,8,3,"#FFFFFF");R(X+5,Y+4,5,2,"#FFFFFF")}
    if(!top){R(X,Y+6,16,10,"#93BE72");R(X,Y+5,16,2,"#A8CF86");R(X+(hash(x,9)*8|0),Y+3,6,4,"#A8CF86");R(X+3,Y+14,10,2,"#7DA95E");if(hash(x,3)>.5)R(X+6,Y+8,2,2,"#F4B9C4")}return}
  if(isFacade(t)){const [a,b]=WALLPAPER[t];R(X,Y,16,16,a);if(x%2===0)R(X+6,Y,4,16,b);
    if(WALK.has(tile[y+1]?.[x])||tile[y+1]?.[x]==="water"){R(X,Y+6,16,10,"#D4AE84");R(X,Y+6,16,2,"#E8C9A0");R(X,Y+8,16,1,"#B88E64");for(let i=0;i<16;i+=8)R(X+i+3,Y+10,3,3,"#C9A077");R(X,Y+14,16,2,"#9C7350")}

    case "sage":R(X,Y,16,16,"#BFD0AA");if((x+y)%2===0){R(X+4,Y+4,2,2,"#B3C79C");R(X+11,Y+11,2,2,"#B3C79C")}break;
    case "mint":R(X,Y,16,16,(x+y)%2?"#EEF3E6":"#E2EBD9");R(X+15,Y,1,16,"#D5E0CC");R(X,Y+15,16,1,"#D5E0CC");break;
    case "lav":R(X,Y,16,16,"#CDBCD9");if((x+y)%2===0){R(X+7,Y+5,2,6,"#C3B0D1");R(X+5,Y+7,6,2,"#C3B0D1")}break;
    case "grass":{R(X,Y,16,16,"#B2D28B");const h=hash(x,y);R(X+(h*12|0),Y+((h*97)%12|0),2,3,"#9EC475");R(X+((h*53)%12|0),Y+((h*31)%12|0)+2,2,2,"#A6CA7D");
      if(h>.82){R(X+6,Y+6,3,3,["#F6C9D2","#FFF3B0","#FFFFFF"][(h*30|0)%3]);R(X+7,Y+7,1,1,"#F2B63D")}break}
    case "water":R(X,Y,16,16,"#9FD3DE");break;
    case "dock":R(X,Y,16,16,"#9FD3DE");break;
    case "door":R(X,Y,16,16,"#D7AE7E");R(X,Y,16,1,"#BE925F");R(X,Y+15,16,1,"#BE925F");break;
    case "exit":R(X,Y,16,16,"#D7AE7E");R(X+1,Y+2,14,12,"#C0745A");R(X+2,Y+3,12,10,"#D58A6C");break;

}
const bg=document.createElement("canvas");bg.width=cv.width;bg.height=cv.height;
function buildBG(){
  const c=bg.getContext("2d");c.setTransform(SC,0,0,SC,0,0);c.imageSmoothingEnabled=false;C=c;c.clearRect(0,0,W*T,H*T);

    R(x-3,y-1,6,24,"#F2C7C3");R(x+27,y-1,6,24,"#F2C7C3");R(x-3,y-1,6,2,"#E5A9A4");R(x+27,y-1,6,2,"#E5A9A4");R(x-4,y-3,38,2,"#B88E64")};

  art(22*T+1,T+4,22,18,"#F6D7C3","#9CC48A");art(16*T+6,18*T-10,20,14,"#D7E6F4","#A6C6E0");art(33*T+4,13*T-8,18,13,"#FCE3C7","#E9A6A0");

  R(27*T+30,13*T-2,44,3,"#B88E64");for(let i=0;i<5;i++){const cx=27*T+33+i*8;rbox(cx,13*T-9,6,7,["#FFF8EC","#F2C7C3","#BFE3F2","#F6DFAE","#CFE6C9"][i])}

  box(29*T,T+3,64,26,"#FFFFFF","#9C7350");R(29*T+6,T+8,16,6,"#BFD7F2");R(29*T+40,T+8,16,6,"#E3D3F3");R(29*T+22,T+11,18,1,"#9C8B7A");R(29*T+18,T+19,26,4,"#CDE8D5");R(29*T,T+29,64,2,"#C9A077");

  R(38*T+4,12*T+20,14,14,"#5E4332");R(38*T+5,12*T+21,12,12,"#E8A3A0");R(38*T+7,12*T+23,8,8,"#FFF8EC");R(38*T+9,12*T+25,4,4,"#E8A3A0");
  // signs on wall caps / facades
  const sign=(s,x,y)=>{c.font=`900 8px ${FONT}`;const w=Math.ceil(c.measureText(s).width)+12;rbox(x,y,w,12,"#C99665","#7A5638");R(x+3,y+12,1,2,"#7A5638");R(x+w-4,y+12,1,2,"#7A5638");txt(s,x+w/2,y+9,8,"#FFF4E2","center",900)};
  sign("工作區",6*T,T-6);sign("會議室",33*T-4,T-6);sign("釣魚池・摸魚區",39*T+4,T-6);sign("休息區",15*T+8,17*T+2);sign("茶水間",32*T+4,12*T+2);sign("娛樂室",37*T+4,12*T+2);

/* ================= furniture ================= */
const objs=[],lights=[];
function obj(tx,ty,tw,th,solid,draw,z){if(solid)for(let y=ty;y<ty+th;y++)for(let x=tx;x<tx+tw;x++)walk[y][x]=false;objs.push({z:z??(ty+th)*T,draw})}
function plant(x,y,big){shadow(x-6,y-1,12,2);rbox(x-5,y-8,10,8,"#D9906A");R(x-6,y-9,12,2,"#C47B57");

const desks={};

const IDLE=["coffee","arcade1","sofa1","pongL","tableT","water","bean1","arcade2","sofa2","tableL","bean2","tableR","sofa3","books","printer","petcat","window"];
const claimed={};
function occupant(spot){const id=claimed[spot];if(!id)return null;const a=agents[id];return a.spot===spot&&a.arrived?a:null}
function pickSpot(id){
  const a=agents[id],s=a.state,free=l=>l.find(k=>!claimed[k]||claimed[k]===id);
  if(s==="working"||s==="done"||s==="error"||s==="waiting")return"seat-"+id;
  if(s==="review")return free(["meet3","meet1","meet4","meet2"]);
  if(s==="queued")return free(["q1","q2","q3","q4"]);
  if(s==="stalled")return free(["fish1","fish2","fish3","fish4"]);
  if(s==="offline")return"exit";
  if(claimed.pongL&&!claimed.pongR&&claimed.pongL!==id)return"pongR";
  // 閒暇時隨機挑一個「別人沒占、也不是現在這個」的地點
  const opts=IDLE.filter(k=>(!claimed[k]||claimed[k]===id));
  const fresh=opts.filter(k=>k!==a.lastIdle);
  const pick=(fresh.length?fresh:opts)[Math.floor(Math.random()*(fresh.length?fresh:opts).length)];
  a.lastIdle=pick;return pick;
}
function bfs(sx,sy,tx,ty){
  if(sx===tx&&sy===ty)return[];const prev=new Map(),key=(x,y)=>y*W+x,q=[[sx,sy]];prev.set(key(sx,sy),null);
  while(q.length){const [x,y]=q.shift();if(x===tx&&y===ty)break;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const k=key(nx,ny);if(prev.has(k))continue;
      if(!walk[ny][nx]&&!(nx===tx&&ny===ty))continue;prev.set(k,key(x,y));q.push([nx,ny])}}
  if(!prev.has(key(tx,ty)))return[];const path=[];let k=key(tx,ty);while(k!==null&&k!==key(sx,sy)){path.unshift([k%W+.5,Math.floor(k/W)+.5]);k=prev.get(k)}return path;
}
function retarget(id,instant){
  const a=agents[id];if(a.spot&&claimed[a.spot]===id)delete claimed[a.spot];
  const sp=pickSpot(id);a.spot=sp;claimed[sp]=id;const S=SPOTS[sp];a.arrived=false;
  if(instant){a.x=S.x;a.y=S.y;a.path=[];a.arrived=true;a.face=S.face;a.hidden=!!S.exit;return}
  if(a.hidden){a.x=4.5;a.y=29.4;a.hidden=false}
  const sx=Math.floor(a.x),sy=Math.min(H-1,Math.floor(a.y));let start=[sx,sy];
  if(!walk[sy][sx]){for(const [dx,dy] of [[0,-1],[0,1],[-1,0],[1,0],[0,-2]]){if(walk[sy+dy]?.[sx+dx]){start=[sx+dx,sy+dy];break}}}
  a.path=bfs(start[0],start[1],S.tx,S.ty);a.path.push([S.x,S.y]);
}

async function api(method, p = {}) {
  const r = await fetch(`/user${encodeURIComponent(TOKEN)}/${method}`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(p) });
  const body = await r.json();
  if (!body.ok) throw new Error(body.description || "失敗");
  return body.result;
}

function log(slot, kind, text) {
  if (!slot) return;
  const arr = agentLog[slot] || (agentLog[slot] = []);
  arr.push({ t: Date.now(), k: kind, s: text });
  if (arr.length > 300) arr.splice(0, arr.length - 300);
  if (selected === slot) renderDrawer();
}

function notify(title, body) {
  if (!notifyOn || !("Notification" in window) || Notification.permission !== "granted" || document.hasFocus()) return;
  try { new Notification(title, { body }); } catch {}
}

/* ---------- 帳號 → 畫面上的位置 ---------- */
// 帳號依「機器 → 種類 → 建立順序」排好，依序坐進 8 個工位；超過 8 位的不顯示在辦公室（看板與聊天照常）
const KIND_ORDER = ["claude", "codex", "antigravity", "hermes"];
function mapAccounts() {
  const bots = accounts.filter((a) => a.is_bot).sort((x, y) =>
    String(x.machine ?? "~").localeCompare(String(y.machine ?? "~")) ||
    ((KIND_ORDER.indexOf(x.kind) + 99) % 99) - ((KIND_ORDER.indexOf(y.kind) + 99) % 99) || x.id - y.id);
  // 已停用／刪除的帳號讓出工位；其餘的人留在原位（不會因為重新整理而換位子），新成員坐進空位
  const alive = new Set(bots.map((b) => b.username));
  for (const [slot, u] of Object.entries(userOf)) if (!alive.has(u)) {
    delete userOf[slot]; delete slotOf[u]; delete hubAgents[u];
    Object.assign(agents[slot], { name: "空位", kind: null, machine: null, task: null, tool: "", role: null, state: "offline" });
    if (selected === slot) { selected = null; $("#drawer").hidden = true; }
  }
  for (const b of bots) {
    let slot = slotOf[b.username];
    if (!slot) {
      slot = Array.from({ length: DESK_COUNT }, (_, i) => "desk" + (i + 1)).find((d) => !userOf[d]);
      if (!slot) continue;
      slotOf[b.username] = slot; userOf[slot] = b.username;
    }
    Object.assign(agents[slot], { name: b.first_name, kind: b.kind, machine: b.machine });
  }
  if (bots.length > DESK_COUNT) console.warn(`辦公室最多 ${DESK_COUNT} 個工位，${bots.slice(DESK_COUNT).map((b) => b.username).join("、")} 不會顯示在辦公室`);
}

function applyAgent(u, s, fromEvent) {
  hubAgents[u] = s;
  const slot = slotOf[u];
  if (!slot) return;
  const a = agents[slot];
  let st = s.state;
  if (flashDone[slot] && flashDone[slot] > Date.now() && st !== "offline") st = "done";
  a.role = s.roles.some((r) => r.startsWith("lead:")) ? "owner" : s.roles.some((r) => r.startsWith("reviewer:")) ? "reviewer" : null;
  a.task = s.task ? `#${s.task.task_id} ${s.task.title}` : null;
  a.tool = st === "queued" ? `排隊 ${s.queued} 件` : st === "review" ? (s.detail || "規劃/審查中") : (s.detail || (s.task ? s.task.title : ""));
  a.stallSec = s.last_activity ? Math.max(0, Math.floor((Date.now() - s.last_activity) / 1000)) : 0;
  a.sessionUp = s.session_up;
  if (fromEvent && s.changed_state) {
    log(slot, "state", `狀態 → ${STATES[s.state] || s.state}`);
    if (["stalled", "error", "waiting"].includes(s.state)) {
      const msg = s.state === "waiting" ? "在等你批准權限" : s.state === "error" ? `報錯：${s.detail || ""}` : "超過時間沒有動靜";
      toast(`${a.name} ${msg}`, ST_COLOR[s.state]);
      notify(`${a.name}：${STATES[s.state]}`, msg);
    }
  }
  if (a.state !== st) setState(slot, st);
  else if (selected === slot) renderDrawer();
}

/* ---------- 任務與目標 ---------- */
function upsertTask(t) {
  const i = hubTasks.findIndex((x) => x.task_id === t.task_id);
  const prev = i >= 0 ? hubTasks[i] : null;
  if (i >= 0) hubTasks[i] = t; else hubTasks.push(t);
  return prev;

/* ---------- 事件 ---------- */
function handleEvent(ev) {
  const p = ev.payload;
  const actor = accounts.find((a) => a.id === ev.actor_id);
  const slot = actor ? slotOf[actor.username] : null;
  switch (ev.type) {
    case "agent": applyAgent(p.username, p, true); break;
    case "message": {
      addFeed(ev, false);
      log(slot, "k", `💬 ${(p.text || "").slice(0, 120)}`);
      for (const to of p.to || []) { const tu = accounts.find((a) => a.id === to); if (tu && (p.text || "").includes("@" + tu.username)) log(slotOf[tu.username], "dim", `📨 ${actor?.first_name}：${(p.text || "").slice(0, 100)}`); }
      if (!ev.chat_key?.startsWith("g:") && p.buttons && actor?.is_bot) { toast(`${actor.first_name} 需要你批准：${(p.text || "").slice(0, 40)}`, "#E0A43A"); notify(`${actor.first_name} 需要你批准`, p.text || ""); }
      break;
    }
    case "edit": addFeed(ev, true); break;
    case "hook": if (p.detail && p.event !== "PostToolUse") log(slot, p.state === "error" ? "bad" : "ok", `${p.event} · ${p.detail}`); break;
    case "task": case "task_progress": case "task_review": case "task_expired": {
      const prev = upsertTask(p);
      const as = slotOf[p.assignee];
      if (ev.type === "task_progress" && p.note) log(as, "dim", `進度 #${p.task_id}：${p.note}`);
      if (prev && prev.status !== p.status) {
        log(as, "state", `#${p.task_id} → ${p.status}`);
        if (p.status === "done") { flashDone[as] = Date.now() + 3500; if (as) setState(as, "done"); setTimeout(() => { const u = userOf[as]; if (u && hubAgents[u]) applyAgent(u, hubAgents[u], false); }, 3600); toast(`${nameOf(p.assignee)} 完成 #${p.task_id} ${p.title}`, "#E8B830"); notify("任務完成", `#${p.task_id} ${p.title}`); }
        if (p.status === "failed") { toast(`#${p.task_id} 失敗：${p.title}`, "#E0675A"); notify("任務失敗", `#${p.task_id} ${p.title}`); }
        if (ev.type === "task_expired") toast(`#${p.task_id} 租約到期，退回待辦`, "#E0A43A");
      }
      renderBoard(); break;
    }
    case "task_dispatch": {
      upsertTask(p); renderBoard();
      const fromSlot = slotOf[p.created_by] || slot, toSlot = slotOf[p.assignee];
      if (fromSlot && toSlot && fromSlot !== toSlot && !agents[fromSlot].hidden && !agents[toSlot].hidden) papers.push({ from: fromSlot, to: toSlot, t: 0 });
      break;
    }
    case "goal": {
      const i = hubGoals.findIndex((g) => g.goal_id === p.goal_id);
      const prev = i >= 0 ? hubGoals[i] : null;
      if (i >= 0) hubGoals[i] = p; else hubGoals.unshift(p);
      if (!prev) toast(`🎯 新目標 #${p.goal_id}：${p.title}（主管 ${nameOf(p.lead)}）`, "#E9A65A");
      else if (prev.status !== p.status && p.status !== "doing") { toast(`🏁 目標 #${p.goal_id} ${p.status === "done" ? "完成" : p.status}`, "#E8B830"); notify(`目標 #${p.goal_id} ${p.status === "done" ? "完成" : p.status}`, p.summary || p.title); }
      renderBoard(); refreshThreads(); break;
    }
    case "account":
      // 新成員、停用、刪除、改機器或種類：重新分配工位；只改名就直接更新
      if (p.joined || p.changed || !accounts.some((a) => a.id === p.id)) { if (ws && ws.readyState === 1) ws.send("snapshot"); }
      else applyRename(p);
      if (!$("#members").hidden) renderMembers();
      break;
    case "join": {
      const i = joins.findIndex((j) => j.request_id === p.request_id);
      if (i >= 0) joins[i] = p; else joins.push(p);
      if (p.status === "pending" && i < 0) { toast(`🔔 ${KIND_LABEL[p.kind] || p.kind}「${p.name}」申請加入，代碼 ${p.code}`, "#E9A65A"); notify("新成員申請加入", `${p.name}（代碼 ${p.code}）`); }
      renderJoins(); break;
    }
    case "button_answer": if (p.to === ME?.id && p.text) toast(p.text, "#5DB585"); break;
    case "loop_guard": toast(`防循環：bot 在目標 #${p.thread_id || "-"} 互相回太多次，等你發言`, "#E0A43A"); break;
  }
}
function refreshThreads() {
  const sel = $("#chatThread"), cur = sel.value;
  sel.innerHTML = `<option value="">群組（不指定目標）</option>` + hubGoals.filter((g) => g.status === "doing").map((g) => `<option value="${g.goal_id}">目標 #${g.goal_id} ${esc(g.title.slice(0, 20))}</option>`).join("");

function applySnapshot(s) {
  ME = s.me; OFFICE_CHAT = s.office_chat_id; accounts = s.accounts;
  mapAccounts();
  hubGoals = s.goals; hubTasks = s.tasks;
  joins = s.joins || []; renderJoins();
  feed.length = 0;
  for (const ev of s.events) {
    if (ev.type === "message") feed.push(msgFromEvent(ev));
    else if (ev.type === "edit") { const m = feed.find((x) => x.key === ev.chat_key && x.mid === ev.payload.message_id); if (m) { m.text = ev.payload.text; m.buttons = ev.payload.buttons; m.edited = true; } }
    else if (ev.type === "hook") { const a = accounts.find((x) => x.id === ev.actor_id); if (a && ev.payload.detail) (agentLog[slotOf[a.username]] ||= []).push({ t: ev.ts, k: "ok", s: `${ev.payload.event} · ${ev.payload.detail}` }); }
  }
  for (const [u, st] of Object.entries(s.agents)) applyAgent(u, st, false);
  renderLeadSelect();
  $("#me").textContent = `${ME.name}（@${ME.username}）`;
  for (const [slot, a] of Object.entries(agents)) if (!userOf[slot]) { a.name = "空位"; a.kind = null; } // 沒有帳號的工位
  renderBoard(); renderChat(); refreshThreads(); renderLegend();
}

function connect() {
  if (!TOKEN) { showLogin(); return; }
  $("#login").hidden = true;
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws?token=${encodeURIComponent(TOKEN)}`);
  ws.onopen = () => { connected = true; wsRetry = 0; setConn(true); };
  ws.onmessage = (e) => { const m = JSON.parse(e.data); if (m.type === "snapshot") applySnapshot(m); else if (m.type === "event") handleEvent(m.event); };
  ws.onclose = (e) => {
    connected = false; setConn(false);
    if (e.code === 1006 && wsRetry === 0 && !ME) {
      // 第一次就失敗：多半是登入過期或 token 錯了
      fetch(`/user${encodeURIComponent(TOKEN)}/getMe`).then((r) => r.json()).then((b) => {
        if (!b.ok) { TOKEN = ""; try { localStorage.removeItem("office_token"); } catch {} if (ws) ws.onclose = null; showLogin("登入已過期，請重新登入。"); }
      });
    }
    if (TOKEN) { wsRetry++; setTimeout(connect, Math.min(10000, 1000 * wsRetry)); }
  };
}

async function showLogin(err) {

}
function loggedIn(token) {
  TOKEN = token;

  $("#loginPass").value = ""; $("#loginPass2").value = "";

}
function setConn(on) { $("#conn").className = "conn " + (on ? "on" : "off"); $("#conn").textContent = on ? "已連線" : "連線中斷，重試中…"; }

$("#loginForm").addEventListener("submit", async (e) => {

});
$("#useToken").addEventListener("click", () => { setLoginMode(loginMode === "token" ? "login" : "token"); $("#loginErr").textContent = ""; });
$("#logout").addEventListener("click", async () => {

$("#pwBtn").addEventListener("click", async () => {

/* ---------- 成員管理 ---------- */
const KIND_OPTS = ["claude", "hermes", "codex", "antigravity", "other"];
const ago = (ms) => { if (!ms) return "從未連線"; const s = Math.floor((Date.now() - ms) / 1000); return s < 60 ? "剛剛" : s < 3600 ? `${Math.floor(s / 60)} 分鐘前` : s < 86400 ? `${Math.floor(s / 3600)} 小時前` : `${Math.floor(s / 86400)} 天前`; };
async function renderMembers() {
  let list;
  try { list = await api("getMembers"); } catch (err) { $("#memberList").innerHTML = `<p class="hint">${esc(err.message)}</p>`; return; }
  const row = (m) => {
    const work = [m.open_tasks ? `${m.open_tasks} 個未完成任務` : "", m.leading_goals ? `主管 ${m.leading_goals} 個目標` : ""].filter(Boolean).join("、");
    if (!m.is_bot) return `<div class="mrow"><span>🙂</span><b>${esc(m.name)}${m.is_me ? "（你）" : ""}</b><span class="u">@${esc(m.username)}</span><span></span><span class="st">真人</span><span></span><span></span></div>`;
    return `<div class="mrow${m.disabled ? " off" : ""}" data-u="${esc(m.username)}" data-work="${esc(work)}">
      <img src="/icons/${esc(m.kind)}" alt="${esc(m.kind)}">

      <span class="u" title="帳號">@${esc(m.username)}</span>
      <input class="mm" value="${esc(m.machine || "")}" maxlength="16" placeholder="機器" aria-label="機器代號" ${m.disabled ? "disabled" : ""}>
      <select class="mk" aria-label="種類" ${m.disabled ? "disabled" : ""}>${KIND_OPTS.map((k) => `<option value="${k}"${k === m.kind ? " selected" : ""}>${esc(KIND_LABEL[k])}</option>`).join("")}</select>
      <span class="st">${m.disabled ? "已停用" : `${esc(STATES[m.state] || m.state || "")} · ${ago(m.last_seen)}`}${work ? `<br>${esc(work)}` : ""}</span>
      <span class="acts">${m.disabled
        ? `<button class="btn sm" type="button" data-act="enable">重新啟用</button><button class="btn sm danger" type="button" data-act="delete">刪除</button>`
        : `<button class="btn sm" type="button" data-act="save">儲存</button><button class="btn sm ghost" type="button" data-act="disable">停用</button><button class="btn sm danger" type="button" data-act="delete">刪除</button>`}</span>
    </div>`;
  };
  const bots = list.filter((m) => m.is_bot && !m.disabled), off = list.filter((m) => m.is_bot && m.disabled), people = list.filter((m) => !m.is_bot);
  $("#memberList").innerHTML = `<h3>Agent（${bots.length}）</h3>${bots.map(row).join("") || `<p class="hint">還沒有 agent。</p>`}`
    + (off.length ? `<h3>已停用（${off.length}）</h3>${off.map(row).join("")}` : "")
    + `<h3>真人</h3>${people.map(row).join("")}`;
}
function openMembers() { $("#members").hidden = false; renderMembers(); }
$("#membersBtn").addEventListener("click", openMembers);
$("#membersClose").addEventListener("click", () => { $("#members").hidden = true; });
$("#members").addEventListener("click", (e) => { if (e.target.id === "members") $("#members").hidden = true; });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#members").hidden) $("#members").hidden = true; });
$("#memberList").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-act]"); if (!b) return;

  if (act === "disable" && !confirm(`停用「${nm}」？\n\n它的 token 會立即失效、從辦公室畫面拿掉，之後可以重新啟用。${note}`)) return;

    }

/* ---------- 新 agent 申請加入 ---------- */

$("#notifyBtn").addEventListener("click", async () => {
  if (!("Notification" in window)) { toast("這個瀏覽器不支援桌面通知", "#E0675A"); return; }
  if (!notifyOn) { const p = await Notification.requestPermission(); notifyOn = p === "granted"; } else notifyOn = false;

$("#notifyBtn").textContent = notifyOn ? "🔔 通知開" : "🔕 通知關";

// 卡住秒數每秒更新
setInterval(() => { for (const [u, s] of Object.entries(hubAgents)) { const slot = slotOf[u]; if (slot && s.last_activity) agents[slot].stallSec = Math.floor((Date.now() - s.last_activity) / 1000); } }, 1000);

/* ---------- 閒暇時隨機走動 ---------- */
// 只有「空閒」的人會隔一陣子換地方；忙碌、開會、排隊、等批准、卡住（釣魚）、報錯都留在原地
setInterval(() => {
  const t = Date.now();
  for (const [id, a] of Object.entries(agents)) {
    if (a.state !== "idle" || a.hidden || a.path.length || !a.arrived) { a.nextWander = 0; continue; }
    if (!a.nextWander) { a.nextWander = t + 20000 + Math.random() * 25000; continue; }
    if (t >= a.nextWander) { a.nextWander = 0; retarget(id, false); }
  }
}, 1000);

/* ---------- 辦公室的狗：小黑 ---------- */
const pet = { x: 2, y: 27.55, path: [], face: "right", walkT: 0, mode: "sleep", timer: 6, bubble: "", bubbleT: 0, speed: 3, goal: null };
const EMOTES = ["❤", "♪", "？", "！", "汪!", "🦴", "✨", "🐾", "😆", "🥺", "💤", "嗚~"];
function petRandomTile() {
  for (let i = 0; i < 300; i++) {
    const x = 1 + Math.floor(Math.random() * (W - 2)), y = 3 + Math.floor(Math.random() * (H - 4));
    if (walk[y]?.[x] && tile[y][x] !== "exit" && tile[y][x] !== "door") return [x, y];
  }
  return [13, 26];
}
function petEmote(e, sec = 2.5) { pet.bubble = e || EMOTES[Math.floor(Math.random() * EMOTES.length)]; pet.bubbleT = sec; }
function petGo(tx, ty, speed = 3, goal = null) {
  const sx = Math.floor(pet.x), sy = Math.floor(pet.y);
  pet.path = bfs(sx, sy, tx, ty); pet.speed = speed; pet.goal = goal; pet.mode = "walk";
  if (!pet.path.length) { pet.mode = "sit"; pet.timer = 2; }
}
function petTick(dt) {
  pet.timer -= dt; if (pet.bubbleT > 0) pet.bubbleT -= dt;
  if (pet.path.length) {
    const [tx, ty] = pet.path[0], dx = tx - pet.x, dy = ty - pet.y, d = Math.hypot(dx, dy), sp = pet.speed * dt;
    if (Math.abs(dx) > 0.01) pet.face = dx > 0 ? "right" : "left";
    if (d <= sp) { pet.x = tx; pet.y = ty; pet.path.shift(); } else { pet.x += dx / d * sp; pet.y += dy / d * sp; }
    pet.walkT += dt;
    if (!pet.path.length) {
      pet.mode = "sit"; pet.timer = 3 + Math.random() * 6;
      if (pet.goal === "__bed") { pet.mode = "sleep"; pet.timer = 12 + Math.random() * 12; pet.face = "left"; pet.x = DOG_BED.x + 1; pet.y = DOG_BED.y + .55; petEmote("💤", 2); pet.goal = null; }
      if (pet.goal) { const a = agents[pet.goal]; if (a && !a.hidden) { pet.face = a.x > pet.x ? "right" : "left"; petEmote(Math.random() < .6 ? "❤" : "汪!"); } pet.goal = null; }
    }
    return;
  }
  if (pet.mode === "sleep" && pet.timer > 0) { if (pet.bubbleT <= 0 && Math.random() < dt * .3) petEmote("💤", 2); return; }
  if (pet.timer > 0) { if (pet.bubbleT <= 0 && Math.random() < dt * .04) petEmote(); return; }
  const r = Math.random();
  const people = Object.entries(agents).filter(([, a]) => !a.hidden);
  if (r < .5) { const [x, y] = petRandomTile(); petGo(x, y, Math.random() < .25 ? 5.5 : 2.6); }
  else if (r < .75 && people.length) {
    const [id, a] = people[Math.floor(Math.random() * people.length)];
    const tx = Math.floor(a.x) + (Math.random() < .5 ? 1 : -1), ty = Math.min(H - 2, Math.floor(a.y) + 1);
    if (walk[ty]?.[tx]) petGo(tx, ty, 4, id); else { const [x, y] = petRandomTile(); petGo(x, y, 2.6); }
  }
  else if (r < .9) { pet.mode = "sit"; pet.timer = 4 + Math.random() * 5; petEmote(); }
  else petGo(DOG_BED.x + 1, DOG_BED.y, 2.6, "__bed"); // 想睡覺：走回狗窩
}
function drawPet() {
  const x = Math.round(pet.x * T), y = Math.round(pet.y * T), L = pet.face === "left";
  const px = (dx, dy, w, h, c) => R(L ? x - dx - w : x + dx, y + dy, w, h, c); // 以臉的方向左右翻轉
  const body = "#2B2A33", hi = "#45434F", dark = "#18171D", moving = pet.path.length > 0;
  R(x - 7, y - 1, 14, 2, "rgba(110,70,40,.22)");
  if (pet.mode === "sleep" && !moving) {
    px(-7, -5, 14, 5, body); px(-6, -6, 10, 2, hi); px(4, -6, 5, 5, body); px(6, -7, 2, 2, dark); px(7, -3, 1, 1, "#E9A28E"); px(-9, -3, 3, 2, body); return;
  }
  const step = moving ? (Math.floor(pet.walkT * 10) % 2) : 0, sit = pet.mode === "sit" && !moving;
  const wag = Math.round(Math.sin(now * (moving ? 18 : 9)) * 1.5);
  px(-8, -9 + wag, 2, 4, body); px(-9, -11 + wag, 2, 3, body);                        // 尾巴
  if (sit) { px(-6, -8, 9, 6, body); px(-6, -3, 3, 3, body); px(1, -3, 2, 3, body); px(-5, -8, 6, 1, hi); }
  else { px(-6, -7, 11, 5, body); px(-5, -7, 8, 1, hi);                              // 身體
    px(-5, -2, 2, step ? 2 : 3, dark); px(-2, -2, 2, step ? 3 : 2, dark); px(2, -2, 2, step ? 2 : 3, dark); px(4, -2, 1, step ? 3 : 2, dark); }
  const hy = sit ? -14 : -12;
  px(2, hy, 7, 6, body); px(3, hy, 4, 1, hi);                                          // 頭
  px(2, hy - 2, 2, 3, dark); px(6, hy - 2, 2, 3, dark);                                // 耳朵
  px(8, hy + 3, 3, 3, body); px(10, hy + 3, 1, 1, "#0E0E12");                          // 嘴、鼻子
  px(6, hy + 2, 1, 1, "#FFFFFF");                                                      // 眼睛亮點
  if (pet.bubbleT > 0 && (pet.bubble === "❤" || pet.bubble === "😆")) px(9, hy + 5, 1, 2, "#E8A3A0"); // 舌頭
  px(2, hy + 6, 6, 1, "#E0675A");                                                      // 紅項圈
}
function drawPetBubble() {
  const x = pet.x * T, y = pet.y * T;
  if (hover === "pet" || pet.bubbleT > 0) {
    ctx.font = `900 6px ${FONT}`;
    const nw = ctx.measureText("小黑").width;
    rr(x - nw / 2 - 4, y + 2, nw + 8, 8, 4, "rgba(255,248,236,.9)", OL); txt("小黑", x, y + 8, 6, "#5E4332", "center", 900);
  }
  if (pet.bubbleT <= 0) return;
  const a = Math.min(1, pet.bubbleT * 2), by = y - 30 - (1 - Math.min(1, (2.5 - pet.bubbleT) * 4)) * 4;
  ctx.globalAlpha = a;
  ctx.font = `900 9px ${FONT}`;
  const w = Math.max(16, ctx.measureText(pet.bubble).width + 8);
  rr(x - w / 2, by, w, 13, 6, "#FFFFFF", OL);
  ctx.fillStyle = "#FFFFFF"; ctx.beginPath(); ctx.moveTo(x - 3, by + 12.5); ctx.lineTo(x + 3, by + 12.5); ctx.lineTo(x, by + 16); ctx.fill();
  txt(pet.bubble, x, by + 10, 9, "#5E4332", "center", 900);
  ctx.globalAlpha = 1;
}
const petHit = (p) => Math.abs(p.x - pet.x * T) < 10 && p.y > pet.y * T - 16 && p.y < pet.y * T + 3;

/* ---------- 辦公室畫面全螢幕 ---------- */
const stageEl = document.querySelector(".stage");
const fsBtn = $("#fsBtn");
function isFull() { return document.fullscreenElement === stageEl || document.webkitFullscreenElement === stageEl; }
async function toggleFull() {
  try {
    if (isFull()) await (document.exitFullscreen?.() ?? document.webkitExitFullscreen?.());
    else await (stageEl.requestFullscreen?.() ?? stageEl.webkitRequestFullscreen?.());
  } catch { toast("這個瀏覽器不允許全螢幕", "#E0675A"); }
}
function onFullChange() {
  const full = isFull();
  fsBtn.textContent = full ? "✕ 離開全螢幕" : "⛶ 全螢幕";
  // 全螢幕時只會畫出 .stage 裡面的東西：把角色詳情面板與通知搬進來，離開時放回去
  const home = document.body;
  for (const id of ["drawer", "toasts"]) { const el = document.getElementById(id); (full ? stageEl : home).appendChild(el); }
}
fsBtn.addEventListener("click", toggleFull);
document.addEventListener("fullscreenchange", onFullChange);
document.addEventListener("webkitfullscreenchange", onFullChange);
document.addEventListener("keydown", (e) => {
  if ((e.key === "f" || e.key === "F") && !e.ctrlKey && !e.metaKey && !e.altKey && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "")) { e.preventDefault(); toggleFull(); }
});

/* ---------- 啟動 ---------- */
function toast(msg, color) { const t = document.createElement("div"); t.className = "toast card-px"; t.innerHTML = `<i style="background:${color}"></i><span>${esc(msg)}</span>`; $("#toasts").appendChild(t); setTimeout(() => t.remove(), 4500); }
function renderLegend() { $("#legend").innerHTML = Object.entries(STATES).map(([k, l]) => `<div class="lg"><i style="background:${ST_COLOR[k]}"></i><b>${l}</b><span>→ ${PLACE[k]}</span></div>`).join(""); }
function toLogical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W * T, y: (e.clientY - r.top) / r.height * H * T }; }
function hit(p) { let best = null, bd = 1e9; for (const [id, a] of Object.entries(agents)) { if (a.hidden) continue; const x = a.x * T, y = a.y * T; if (p.x > x - 10 && p.x < x + 10 && p.y > y - 38 && p.y < y + 3) { const d = Math.abs(p.y - (y - 14)); if (d < bd) { bd = d; best = id; } } } return best; }
cv.addEventListener("click", (e) => {
  const p = toLogical(e);
  if (petHit(p)) { petEmote(["汪!", "❤", "🐾", "😆"][Math.floor(Math.random() * 4)]); if (!pet.path.length) { pet.mode = "sit"; pet.timer = 4; } return; }
  const id = hit(p); if (id) openDrawer(id);
});
cv.addEventListener("mousemove", (e) => { const p = toLogical(e); hover = petHit(p) ? "pet" : hit(p); cv.style.cursor = hover ? "pointer" : "default"; });
function setState(id, s) { const a = agents[id]; if (a.state === s) return; a.state = s; a.nextWander = 0; retarget(id, false); if (selected === id) renderDrawer(); }

for (const id of Object.keys(agents)) retarget(id, true);
renderLegend(); renderBoard(); buildBG();
(document.fonts ? document.fonts.load(`900 8px "Zen Maru Gothic"`) : Promise.resolve()).then(() => buildBG()).catch(() => {});
requestAnimationFrame(frame);
connect();
